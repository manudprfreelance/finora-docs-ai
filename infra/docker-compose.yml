services:
  postgres:
    image: postgres:17
    container_name: finora-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - finora_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: finora-gotenberg
    restart: unless-stopped

    ports:
      - "3001:3000"

  minio:
    image: minio/minio:latest
    container_name: finora-minio
    restart: unless-stopped

    command:
      server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - finora_minio_data:/data

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile

    container_name: finora-web
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      gotenberg:
        condition: service_started

    environment:
      NODE_ENV: production

      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      OPENAI_API_KEY: ${OPENAI_API_KEY}

      N8N_DOCUMENT_PROCESSING_WEBHOOK_URL:
        ${N8N_DOCUMENT_PROCESSING_WEBHOOK_URL}

      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}

    ports:
      - "3000:3000"

volumes:
  finora_postgres_data:
  finora_minio_data: